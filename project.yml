# XcodeGen spec — source of truth for ReBar.xcodeproj.
# Regenerate the project any time with:  xcodegen generate
#
# This mirrors the SPM / Scripts/build-app.sh setup so the Xcode project and the
# command-line build produce the same app:
#   • same bundle id (com.n14395.re-bar) and Info.plist (used verbatim)
#   • same app icon (Resources/AppIcon.icns, referenced by CFBundleIconFile)
#   • Apple Development signing → stable designated requirement, so macOS keeps
#     granted permissions (Screen Recording, etc.) across rebuilds, exactly like
#     build-app.sh. Package.swift and build-app.sh remain the CLI build path.
name: ReBar
options:
  bundleIdPrefix: com.n14395
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    # Team + automatic signing: Xcode picks the Apple Development identity, which
    # yields the same CN-based designated requirement build-app.sh relies on.
    DEVELOPMENT_TEAM: P52946XHRJ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"          # Swift 6 language mode, matching Package.swift
targets:
  ReBar:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/ReBar
      - path: Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ReBar
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.re-bar
        # Use the hand-maintained Info.plist as-is (LSUIElement agent app, icon,
        # versions, usage strings) instead of an Xcode-generated one.
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
